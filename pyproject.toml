[project]
name = "saml2-sp"
version = "0.1.1"
description = "Server-side SAML 2.0 service provider: signed AuthnRequests, HTTP-POST, HTTP-Redirect and HTTP-Artifact responses, encrypted assertions, and a Shared Signals poll receiver."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Iya CyberSecurity Solutions, LLC" }]
dependencies = [
  "cryptography>=42",
  "lxml>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
saml2-sp = "saml2_sp.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts", "tests"]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/rcbj/saml2-sp-python"
Repository = "https://github.com/rcbj/saml2-sp-python"
Issues = "https://github.com/rcbj/saml2-sp-python/issues"
